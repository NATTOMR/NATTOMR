<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="130">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#051a14" />
    </linearGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF99" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00FF99" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes cycleText {
        0%, 22% { opacity: 1; transform: translateY(0px); }
        25%, 97% { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes cycleText2 {
        0%, 23% { opacity: 0; transform: translateY(8px); }
        26%, 48% { opacity: 1; transform: translateY(0px); }
        51%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes cycleText3 {
        0%, 49% { opacity: 0; transform: translateY(8px); }
        52%, 73% { opacity: 1; transform: translateY(0px); }
        76%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes cycleText4 {
        0%, 74% { opacity: 0; transform: translateY(8px); }
        77%, 96% { opacity: 1; transform: translateY(0px); }
        99%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(130px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      .line1 { animation: cycleText 16s infinite ease-in-out; }
      .line2 { animation: cycleText2 16s infinite ease-in-out; }
      .line3 { animation: cycleText3 16s infinite ease-in-out; }
      .line4 { animation: cycleText4 16s infinite ease-in-out; }
      .cursor { animation: blink 0.8s infinite; }
      .scan { animation: scanline 4s linear infinite; }
      .border-glow { animation: pulseGlow 3s ease-in-out infinite; }
      
      .terminal-text {
        font-family: 'SF Pro Display', -apple-system, 'Segoe UI', 'JetBrains Mono', 'Fira Code', monospace;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.5px;
      }
      .tag-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="896" height="126" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#00FF99" stroke-width="0.5">
    <line x1="0" y1="30" x2="900" y2="30" />
    <line x1="0" y1="65" x2="900" y2="65" />
    <line x1="0" y1="100" x2="900" y2="100" />
    <line x1="150" y1="0" x2="150" y2="130" />
    <line x1="300" y1="0" x2="300" y2="130" />
    <line x1="450" y1="0" x2="450" y2="130" />
    <line x1="600" y1="0" x2="600" y2="130" />
    <line x1="750" y1="0" x2="750" y2="130" />
  </g>

  <!-- Glowing Border -->
  <rect x="2" y="2" width="896" height="126" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" class="border-glow" />

  <!-- Terminal Top Bar -->
  <g transform="translate(25, 24)">
    <circle cx="0" cy="0" r="5" fill="#FF5F56" />
    <circle cx="16" cy="0" r="5" fill="#FFBD2E" />
    <circle cx="32" cy="0" r="5" fill="#27C93F" />
    <text x="50" y="4" fill="#00FF99" class="tag-text" opacity="0.85">● SOC // BLUE TEAM TERMINAL</text>
  </g>

  <!-- Status Badge Right -->
  <g transform="translate(730, 24)">
    <rect x="-10" y="-10" width="145" height="20" rx="10" fill="#00FF99" fill-opacity="0.1" stroke="#00FF99" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="0" cy="0" r="3.5" fill="#00FF99" />
    <text x="10" y="3.5" fill="#00FF99" class="tag-text">LIVE DEFENSE</text>
  </g>

  <!-- Cycling Animated Main Text Lines -->
  <g transform="translate(450, 82)" text-anchor="middle" class="terminal-text">
    
    <!-- Line 1 -->
    <g class="line1">
      <text fill="#00FF99" filter="url(#glow)">🛡️ "Don't hack me, I'm new!" 😉</text>
    </g>

    <!-- Line 2 -->
    <g class="line2">
      <text fill="#00E5FF" filter="url(#glow)">🌐 "Let's protect the world together!" 🛡️</text>
    </g>

    <!-- Line 3 -->
    <g class="line3">
      <text fill="#00FF99" filter="url(#glow)">⚡ Building Enterprise SOC Labs &amp; SIEM Defense 🚀</text>
    </g>

    <!-- Line 4 -->
    <g class="line4">
      <text fill="#38BDF8" filter="url(#glow)">🔍 Threat Detection • Malware Analysis • Incident Response</text>
    </g>

  </g>
</svg>
