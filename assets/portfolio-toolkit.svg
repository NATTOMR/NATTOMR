<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="210">
  <defs>
    <style>
      .tool-label {
        font-family: 'SF Pro Display', -apple-system, 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11.5px;
        font-weight: 600;
        fill: #94A3B8;
        letter-spacing: 0.8px;
        text-anchor: middle;
      }
      .grid-dot {
        fill: #00FF99;
        opacity: 0.18;
      }
      .tool-card {
        transition: transform 0.2s ease;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="210" rx="14" fill="#030712" />
  
  <!-- Subtle Cyber Grid Dots -->
  <g class="grid-dot">
    <circle cx="60" cy="20" r="1.2" /><circle cx="180" cy="20" r="1.2" /><circle cx="300" cy="20" r="1.2" /><circle cx="420" cy="20" r="1.2" /><circle cx="540" cy="20" r="1.2" /><circle cx="660" cy="20" r="1.2" /><circle cx="780" cy="20" r="1.2" /><circle cx="900" cy="20" r="1.2" />
    <circle cx="60" cy="110" r="1.2" /><circle cx="180" cy="110" r="1.2" /><circle cx="300" cy="110" r="1.2" /><circle cx="420" cy="110" r="1.2" /><circle cx="540" cy="110" r="1.2" /><circle cx="660" cy="110" r="1.2" /><circle cx="780" cy="110" r="1.2" /><circle cx="900" cy="110" r="1.2" />
    <circle cx="60" cy="195" r="1.2" /><circle cx="180" cy="195" r="1.2" /><circle cx="300" cy="195" r="1.2" /><circle cx="420" cy="195" r="1.2" /><circle cx="540" cy="195" r="1.2" /><circle cx="660" cy="195" r="1.2" /><circle cx="780" cy="195" r="1.2" /><circle cx="900" cy="195" r="1.2" />
  </g>

  <!-- ==================== ROW 1 ==================== -->

  <!-- 1. Wazuh -->
  <g transform="translate(60, 48)">
    <g transform="scale(0.85)">
      <path d="M-19 -16 h7 l8 23 5 -14 -3.5 -9 h7 l4 12 4 -12 h7 l-9 29 h-6 l-6 -20 -6 20 h-9.5 l-5 -29 h7 l4 16 5 -16 z" fill="#00A4E4" />
      <circle cx="18" cy="8" r="3.8" fill="#00A4E4" />
    </g>
    <text y="38" class="tool-label">Wazuh</text>
  </g>

  <!-- 2. Splunk -->
  <g transform="translate(180, 48)">
    <text x="0" y="2" fill="#EA005A" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="-0.5px">splunk&gt;</text>
    <text y="38" class="tool-label">Splunk</text>
  </g>

  <!-- 3. Microsoft Sentinel -->
  <g transform="translate(300, 48)">
    <g transform="scale(1.1)">
      <path d="M0 -15 L13 -9 L13 3 C13 11 0 16 0 16 C0 16 -13 11 -13 3 L-13 -9 Z" fill="#0078D4" fill-opacity="0.25" stroke="#0078D4" stroke-width="1.8" />
      <path d="M0 -11 L9 -6 L9 3 C9 9 0 13 0 13 C0 13 -9 9 -9 3 L-9 -6 Z" fill="#50E6FF" fill-opacity="0.35" />
      <circle cx="0" cy="1" r="4.5" stroke="#50E6FF" stroke-width="1.6" fill="none" />
      <path d="M0 -4v8 M-4 1h8" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" />
    </g>
    <text y="38" class="tool-label">Microsoft Sen...</text>
  </g>

  <!-- 4. Wireshark -->
  <g transform="translate(420, 48)">
    <g transform="scale(1.1)">
      <path d="M-12 10 C-10 10 -4 9 0 4 C6 -3 10 -13 12 -15 C10 -7 4 1 -6 6 C-10 8 -13 8 -13 8 Z" fill="#1679A7" />
      <path d="M-14 10 C-6 10 4 7 13 13 C8 9 0 8 -8 8 C-11 8 -14 9 -14 10 Z" fill="#38BDF8" />
    </g>
    <text y="38" class="tool-label">Wireshark</text>
  </g>

  <!-- 5. Nmap -->
  <g transform="translate(540, 48)">
    <g transform="scale(0.85)">
      <ellipse cx="0" cy="0" rx="18" ry="9" fill="#0284C7" fill-opacity="0.2" stroke="#00E5FF" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#00E5FF" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
      <path d="M0 -9v18 M-18 0h36" stroke="#00E5FF" stroke-width="0.8" opacity="0.7" />
      <path d="M-14 -4 C-8 -8 8 -8 14 -4 M-14 4 C-8 8 8 8 14 4" stroke="#38BDF8" stroke-width="1" fill="none" />
    </g>
    <text y="38" class="tool-label">Nmap</text>
  </g>

  <!-- 6. Nessus -->
  <g transform="translate(660, 48)">
    <g transform="scale(1.1)">
      <circle cx="0" cy="0" r="13" stroke="#00C16C" stroke-width="2.2" fill="#002D3C" fill-opacity="0.5" />
      <circle cx="0" cy="0" r="7.5" stroke="#00E58F" stroke-width="1.5" fill="#00C16C" fill-opacity="0.2" />
      <circle cx="0" cy="-13" r="2.2" fill="#00FF9D" />
      <path d="M0 -13v4 M0 9v4 M-13 0h4 M9 0h4" stroke="#00C16C" stroke-width="2" stroke-linecap="round" />
    </g>
    <text y="38" class="tool-label">Nessus</text>
  </g>

  <!-- 7. Burp Suite -->
  <g transform="translate(780, 48)">
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#FF6633" />
    <path d="M2 -9 L-7 1 L0 1 L-2 9 L7 -1 L0 -1 Z" fill="#0D1117" />
    <text y="38" class="tool-label">Burp Suite</text>
  </g>

  <!-- 8. YARA -->
  <g transform="translate(900, 48)">
    <g transform="scale(1.1)">
      <path d="M0 -14 L12 -7 L12 7 L0 14 L-12 7 L-12 -7 Z" fill="#C2185B" fill-opacity="0.25" stroke="#E91E63" stroke-width="2" stroke-linejoin="round" />
      <path d="M-6 -6 L0 1v7" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M6 -6 L0 1" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="0" cy="8" r="1.5" fill="#FFFFFF" />
    </g>
    <text y="38" class="tool-label">YARA</text>
  </g>

  <!-- ==================== ROW 2 ==================== -->

  <!-- 9. Suricata -->
  <g transform="translate(60, 150)">
    <g transform="scale(1.1)">
      <path d="M0 -13 C-5 -13 -8 -9 -8 -3 C-8 1 -6.5 4.5 -4 7v4 C-4 12 -3 13 -2 13h4 C3 13 4 12 4 11v-4 C6.5 4.5 8 1 8 -3 C8 -9 5 -13 0 -13 Z" fill="#EF5B25" fill-opacity="0.2" stroke="#EF5B25" stroke-width="1.8" />
      <circle cx="-3" cy="-2" r="1.4" fill="#EF5B25" />
      <circle cx="3" cy="-2" r="1.4" fill="#EF5B25" />
      <path d="M-2 2 C-1 3 1 3 2 2" stroke="#FF8A50" stroke-width="1.4" stroke-linecap="round" />
      <path d="M-7 -9 L-10 -7 M7 -9 L10 -7" stroke="#EF5B25" stroke-width="1.6" stroke-linecap="round" />
    </g>
    <text y="38" class="tool-label">Suricata</text>
  </g>

  <!-- 10. Volatility -->
  <g transform="translate(180, 150)">
    <g transform="scale(1.1)">
      <rect x="-11" y="-9" width="22" height="18" rx="4" stroke="#8E24AA" stroke-width="2" fill="#8E24AA" fill-opacity="0.2" />
      <path d="M-6 -3 L-2 4 L2 -3 L6 4" stroke="#BA68C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-6" cy="-12" r="1.3" fill="#BA68C8" /><circle cx="0" cy="-12" r="1.3" fill="#BA68C8" /><circle cx="6" cy="-12" r="1.3" fill="#BA68C8" />
      <path d="M-6 -12v3 M0 -12v3 M6 -12v3 M-6 9v3 M0 9v3 M6 9v3" stroke="#BA68C8" stroke-width="1.6" stroke-linecap="round" />
    </g>
    <text y="38" class="tool-label">Volatility</text>
  </g>

  <!-- 11. TheHive -->
  <g transform="translate(300, 150)">
    <g transform="scale(1.1)">
      <path d="M0 -12 L6 -8v8 L0 0 L-6 -8 Z" fill="#F39C12" fill-opacity="0.3" stroke="#F39C12" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M6 0 L12 4v8 L6 16 L0 12v-8 Z" fill="#F1C40F" fill-opacity="0.3" stroke="#F1C40F" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M-6 0 L0 4v8 L-6 16 L-12 12v-8 Z" fill="#E67E22" fill-opacity="0.3" stroke="#E67E22" stroke-width="1.8" stroke-linejoin="round" />
      <circle cx="0" cy="-4" r="1.3" fill="#FFFFFF" />
      <circle cx="6" cy="8" r="1.3" fill="#FFFFFF" />
      <circle cx="-6" cy="8" r="1.3" fill="#FFFFFF" />
    </g>
    <text y="38" class="tool-label">TheHive</text>
  </g>

  <!-- 12. MISP -->
  <g transform="translate(420, 150)">
    <g transform="scale(1.1)">
      <circle cx="0" cy="0" r="4.5" fill="#E91E63" />
      <circle cx="-9" cy="-7" r="2.3" fill="#F06292" /><circle cx="9" cy="-7" r="2.3" fill="#F06292" />
      <circle cx="-9" cy="7" r="2.3" fill="#F06292" /><circle cx="9" cy="7" r="2.3" fill="#F06292" />
      <path d="M-9 -7 L0 0 M9 -7 L0 0 M-9 7 L0 0 M9 7 L0 0" stroke="#E91E63" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
      <circle cx="0" cy="0" r="7.5" stroke="#E91E63" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" fill="none" />
    </g>
    <text y="38" class="tool-label">MISP</text>
  </g>

  <!-- 13. MongoDB -->
  <g transform="translate(540, 150)">
    <g transform="scale(1.1)">
      <path d="M0 -15 C4 -11 8 -3 8 4 C8 11 3 15 0 16 C-3 15 -8 11 -8 4 C-8 -3 -4 -11 0 -15 Z" fill="#47A248" />
      <path d="M0 -15v31" stroke="#3D8E3E" stroke-width="1" />
      <path d="M0 16 L-1 18h2 Z" fill="#888888" />
    </g>
    <text y="38" class="tool-label">MongoDB</text>
  </g>

  <!-- 14. Python -->
  <g transform="translate(660, 150)">
    <g transform="scale(1.1)">
      <path d="M-1 -13 C-7 -13 -12 -10 -12 -5 C-12 0 -7 0 -7 0 L-7 3 L2 3 L2 1 C2 -3 -3 -3 -3 -3 L0 -3 C4 -3 7 -6 7 -10 C7 -13 3 -13 -1 -13 Z" fill="#3776AB" />
      <circle cx="-4" cy="-9" r="1.2" fill="#FFFFFF" />
      <path d="M1 13 C7 13 12 10 12 5 C12 0 7 0 7 0 L7 -3 L-2 -3 L-2 -1 C-2 3 3 3 3 3 L0 3 C-4 3 -7 6 -7 10 C-7 13 -3 13 1 13 Z" fill="#FFD43B" />
      <circle cx="4" cy="9" r="1.2" fill="#FFFFFF" />
    </g>
    <text y="38" class="tool-label">Python</text>
  </g>

  <!-- 15. FastAPI -->
  <g transform="translate(780, 150)">
    <circle cx="0" cy="0" r="13" fill="#009688" />
    <path d="M2 -8 L-5 1 L0 1 L-2 8 L6 -1 L1 -1 Z" fill="#FFFFFF" />
    <text y="38" class="tool-label">FastAPI</text>
  </g>

  <!-- 16. REST APIs -->
  <g transform="translate(900, 150)">
    <circle cx="0" cy="0" r="13" fill="#030712" stroke="#85EA2D" stroke-width="2" />
    <text x="0" y="4.5" fill="#85EA2D" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">{...}</text>
    <text y="38" class="tool-label">REST APIs</text>
  </g>

</svg>
